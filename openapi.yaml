openapi: 3.1.0

info:
  title: Crowd Transcription Fixer API
  version: 1.0.0
  description: |
    REST API for a crowd-sourced subtitle correction service.

    **How it works**
    1. Clients browse available audios.
    2. Clients reserve a random audio via `POST /audios/reserve`, receiving an audio + task_id.
       The audio is locked for 5 minutes — no other client can reserve it during that window.
    3. The client fetches task details (media link + subtitles) to start working; the lock becomes permanent.
    4. The client submits the corrected text.

servers:
  - url: /api/v1/crowd
    description: Versioned API root

tags:
  - name: audios
    description: Browse and reserve audio assets
  - name: tasks
    description: Manage and submit editing tasks

# ---------------------------------------------------------------------------
# Reusable components
# ---------------------------------------------------------------------------
components:
  parameters:
    audioId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Audio ID

    taskId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Task ID

  schemas:

    MaggidAccent:
      type: integer
      enum: [1, 2, 3, 4, 5]
      description: |
        Accent filter:
        1 = Ashkenazi, 2 = Sephardi, 3 = Chassidic, 4 = Israeli, 5 = Other

    Language:
      type: integer
      enum: [1, 2, 3, 4, 5, 6, 7, 9]
      description: |
        Language filter:
        1 = Hebrew, 2 = English, 3 = Yiddish, 4 = Spanish,
        5 = Arabic, 6 = French, 7 = German, 9 = Russian

    Audio:
      type: object
      required: [id]
      properties:
        id:
          type: string
          description: Audio asset ID.
        url:
          type: string
          format: uri
          nullable: true
          description: Direct URL to the audio file.
        maggid_description:
          type: string
          nullable: true
        massechet_name:
          type: string
          nullable: true
        daf_name:
          type: string
          nullable: true
        duration:
          type: integer
          nullable: true
          description: Duration in seconds.

    AudioReservation:
      allOf:
        - $ref: '#/components/schemas/Audio'
        - type: object
          required: [task_id]
          properties:
            task_id:
              type: string
              description: |
                ID of the PENDING task created for this reservation.
                Use this to call GET /tasks/{id}, POST /tasks/{id}/submit, etc.

    AudioListItem:
      type: object
      required: [id]
      properties:
        id:
          type: string
        maggid_description:
          type: string
          nullable: true
        massechet_name:
          type: string
          nullable: true
        daf_name:
          type: string
          nullable: true
        duration:
          type: integer
          nullable: true

    AudioList:
      type: object
      required: [data, total]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AudioListItem'
        total:
          type: integer
          description: Total available (unclaimed) audios.

    TaskStatus:
      type: string
      enum: [PENDING, STARTED, FINISHED]

    TaskDetail:
      type: object
      required: [media_link, subtitles]
      properties:
        media_link:
          type: string
          format: uri
          description: URL to the audio file for playback.
        subtitles:
          type: string
          description: Subtitle text for the audio (VTT format).

    TaskEnrichment:
      type: object
      required: [task_id, media_id]
      properties:
        task_id:
          type: string
        media_id:
          type: string
        text:
          type: string
          nullable: true
          description: Corresponding Gemara text from Sefaria, stripped of nikud and HTML.

    Error:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
          description: Human-readable error message.
          example: "Audio not found"

  responses:
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:

  # ---- Audios --------------------------------------------------------------

  /audios:
    get:
      operationId: getRandomAudio
      summary: Get a random unclaimed audio
      description: Returns a random audio that has no active reservation or task. Does not create a reservation.
      tags: [audios]
      parameters:
        - name: reading
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/MaggidAccent'
        - name: language
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Language'
      responses:
        '200':
          description: A random audio, or `{"detail": "Audio not found"}` if none available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Audio'

  /audios/list:
    get:
      operationId: listAudios
      summary: List unclaimed audios
      description: Returns all audios with no active reservation or task.
      tags: [audios]
      responses:
        '200':
          description: List of available audios.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioList'

  /audios/{id}:
    get:
      operationId: getAudio
      summary: Get a single audio by ID
      tags: [audios]
      parameters:
        - $ref: '#/components/parameters/audioId'
      responses:
        '200':
          description: Audio details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Audio'
        '404':
          $ref: '#/components/responses/NotFound'

  /audios/reserve:
    post:
      operationId: reserveAudio
      summary: Reserve a random audio
      description: |
        Atomically picks a random unclaimed audio and creates a PENDING task for it.
        The audio is locked for **5 minutes**. If the client does not call
        `GET /tasks/{id}` within that window, the reservation expires and the
        audio becomes available to other clients again.

        Returns the audio details plus the `task_id` to use for subsequent calls.
      tags: [audios]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reading:
                  $ref: '#/components/schemas/MaggidAccent'
                language:
                  $ref: '#/components/schemas/Language'
      responses:
        '201':
          description: Audio reserved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioReservation'
        '404':
          description: No available audio matching the filters.
          $ref: '#/components/responses/NotFound'

  # ---- Tasks ---------------------------------------------------------------

  /tasks/{id}:
    get:
      operationId: getTask
      summary: Start working on a task
      description: |
        Returns the media URL and subtitle text for the task.
        Transitions status from `PENDING` → `STARTED` and clears the 5-minute
        expiry lock, making the task permanent.
      tags: [tasks]
      parameters:
        - $ref: '#/components/parameters/taskId'
      responses:
        '200':
          description: Task details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetail'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      operationId: deleteTask
      summary: Delete a task
      description: Removes the task and releases the audio back into the pool.
      tags: [tasks]
      parameters:
        - $ref: '#/components/parameters/taskId'
      responses:
        '204':
          description: Task deleted.
        '404':
          $ref: '#/components/responses/NotFound'

  /tasks/{id}/enrich:
    get:
      operationId: enrichTask
      summary: Fetch Gemara reference text
      description: |
        Calls the Sefaria API to retrieve the Gemara text for the daf associated
        with this task. Returns `text: null` if the lookup fails or no tractate
        mapping exists.
      tags: [tasks]
      parameters:
        - $ref: '#/components/parameters/taskId'
      responses:
        '200':
          description: Enrichment data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEnrichment'
        '404':
          $ref: '#/components/responses/NotFound'

  /tasks/{id}/submit:
    post:
      operationId: submitTask
      summary: Submit corrected subtitle text
      description: |
        Writes the corrected text to S3 and marks the task as `FINISHED`.
      tags: [tasks]
      parameters:
        - $ref: '#/components/parameters/taskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  description: The corrected subtitle text (VTT format).
      responses:
        '204':
          description: Submission accepted.
        '404':
          $ref: '#/components/responses/NotFound'
