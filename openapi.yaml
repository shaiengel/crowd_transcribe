openapi: 3.1.0

info:
  title: Crowd Transcription Fixer API
  version: 1.0.0
  description: |
    REST API for a crowd-sourced subtitle correction service.

    **How it works**
    1. Clients browse available audios.
    2. Clients start a task via `POST /tasks/start`, receiving an audio + task_id.
       The audio is locked for as long as the task has status `STARTED`.
    3. The client fetches task details via `GET /tasks/{id}` (read-only).
    4. The client submits the corrected text, transitioning the task to `FINISHED`.

servers:
  - url: /api/v1/crowd
    description: Versioned API root

tags:
  - name: audios
    description: Browse and reserve audio assets
  - name: tasks
    description: Manage and submit editing tasks

# ---------------------------------------------------------------------------
# Reusable components
# ---------------------------------------------------------------------------
components:
  parameters:
    audioId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Audio ID

    taskId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Task ID

  schemas:

    MaggidAccent:
      type: integer
      enum: [1, 2, 3, 4, 5]
      description: |
        Accent filter:
        1 = Ashkenazi, 2 = Sephardi, 3 = Chassidic, 4 = Israeli, 5 = Other

    Language:
      type: integer
      enum: [1, 2, 3, 4, 5, 6, 7, 9]
      description: |
        Language filter:
        1 = Hebrew, 2 = English, 3 = Yiddish, 4 = Spanish,
        5 = Arabic, 6 = French, 7 = German, 9 = Russian

    Audio:
      type: object
      required: [id]
      properties:
        id:
          type: string
          description: Audio asset ID.
        url:
          type: ['string', 'null']
          format: uri
          description: Direct URL to the audio file.
        maggid_description:
          type: ['string', 'null']
        massechet_name:
          type: ['string', 'null']
        daf_name:
          type: ['string', 'null']
        duration:
          type: ['integer', 'null']
          description: Duration in seconds.

    AudioReservation:
      allOf:
        - $ref: '#/components/schemas/Audio'
        - type: object
          required: [task_id]
          properties:
            task_id:
              type: string
              description: |
                ID of the STARTED task created for this audio.
                Use this to call GET /tasks/{id}, POST /tasks/{id}/submit, etc.

    AudioListItem:
      type: object
      required: [id]
      properties:
        id:
          type: string
        maggid_description:
          type: ['string', 'null']
        massechet_name:
          type: ['string', 'null']
        daf_name:
          type: ['string', 'null']
        duration:
          type: ['integer', 'null']

    AudioList:
      type: object
      required: [data, total]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AudioListItem'
        total:
          type: integer
          description: Total available (unclaimed) audios.

    RabbiListItem:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          description: Rabbi (maggid) ID.
        name:
          type: string
          description: Rabbi description/name.

    TaskStatus:
      type: string
      enum: [STARTED, FINISHED]

    TaskDetail:
      type: object
      required: [media_link, subtitles]
      properties:
        media_link:
          type: string
          format: uri
          description: URL to the audio file for playback.
        subtitles:
          type: string
          description: Subtitle text for the audio (VTT format).

    TaskEnrichment:
      type: object
      required: [task_id, media_id]
      properties:
        task_id:
          type: string
        media_id:
          type: string
        text:
          type: ['string', 'null']
          description: Corresponding Gemara text from Sefaria, stripped of nikud and HTML.

    Error:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
          description: Human-readable error message.
          example: "Audio not found"

  responses:
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:

  # ---- Audios --------------------------------------------------------------

  /audios:
    get:
      operationId: getRandomAudio
      summary: Get a random unclaimed audio
      description: Returns a random audio that has no active reservation or task. Does not create a reservation.
      tags: [audios]
      parameters:
        - name: reading
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/MaggidAccent'
        - name: language
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Language'
      responses:
        '200':
          description: 'A random audio, or `{"detail": "Audio not found"}` if none available.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Audio'

  /audios/list:
    get:
      operationId: listAudios
      summary: List unclaimed audios
      description: Returns all audios with no active reservation or task.
      tags: [audios]
      responses:
        '200':
          description: List of available audios.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioList'

  /audio/rabbi_list:
    get:
      operationId: listRabbis
      summary: List available rabbis
      description: Returns all rabbis (maggidim) with Hebrew language entries and non-empty descriptions.
      tags: [audios]
      responses:
        '200':
          description: List of rabbis.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RabbiListItem'

  /audios/{id}:
    get:
      operationId: getAudio
      summary: Get a single audio by ID
      tags: [audios]
      parameters:
        - $ref: '#/components/parameters/audioId'
      responses:
        '200':
          description: Audio details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Audio'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---- Tasks ---------------------------------------------------------------

  /tasks/start:
    post:
      operationId: startTask
      summary: Start a task for a random available audio
      description: |
        Atomically picks a random available audio (no STARTED task) and creates
        a STARTED task for it. The audio remains locked until the task is deleted
        or submitted.

        Returns the audio details plus the `task_id` to use for subsequent calls.
      tags: [tasks]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reading:
                  $ref: '#/components/schemas/MaggidAccent'
                language:
                  $ref: '#/components/schemas/Language'
                rabbi_id:
                  type: integer
                  description: Filter by specific rabbi (maggid) ID.
      responses:
        '201':
          description: Task started successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioReservation'
        '404':
          description: No available audio matching the filters.
          $ref: '#/components/responses/NotFound'

  /tasks/{id}:
    get:
      operationId: getTask
      summary: Get task media and subtitles
      description: Returns the media URL and VTT subtitle text for the task (read-only, no status changes).
      tags: [tasks]
      parameters:
        - $ref: '#/components/parameters/taskId'
      responses:
        '200':
          description: Task details (media link + subtitles).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetail'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      operationId: deleteTask
      summary: Delete a task
      description: |
        Deletes the task and releases the audio back into the pool.
        If the task status is `FINISHED`, this is a no-op (returns 204 without deleting).
      tags: [tasks]
      parameters:
        - $ref: '#/components/parameters/taskId'
      responses:
        '204':
          description: Task deleted (or was already FINISHED — no-op).
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      operationId: submitTask
      summary: Submit corrected subtitle text
      description: Writes the corrected text to S3 and marks the task as `FINISHED`.
      tags: [tasks]
      parameters:
        - $ref: '#/components/parameters/taskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  description: The corrected subtitle text (VTT format).
      responses:
        '204':
          description: Submission accepted.
        '404':
          $ref: '#/components/responses/NotFound'

  /tasks/{id}/enrich:
    get:
      operationId: enrichTask
      summary: Fetch Gemara reference text
      description: |
        Calls the Sefaria API to retrieve the Gemara text for the daf associated
        with this task. Returns `text: null` if the lookup fails or no tractate
        mapping exists.
      tags: [tasks]
      parameters:
        - $ref: '#/components/parameters/taskId'
      responses:
        '200':
          description: Enrichment data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEnrichment'
        '404':
          $ref: '#/components/responses/NotFound'